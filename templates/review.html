<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Review Unknown Groups</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div class="wrap">
    <section class="hero">
      <div>
        <h1>Review Unknown Groups</h1>
        <p>Moi group la mot nguoi unknown duoc gom tu nhieu frame va nhieu goc mat. Ban gan mot lan la them ca nhom mau vao cung mot nguoi.</p>
      </div>
      <div class="actions">
        <form id="import-form" enctype="multipart/form-data" onsubmit="event.preventDefault(); importImages(this)">
          <input id="image-files" name="files" type="file" accept="image/*,video/mp4,video/quicktime,video/x-m4v,video/avi" multiple />
          <button type="submit">Import anh</button>
        </form>
        <button onclick="recheckGroups()">Nhan dien hang loat groups</button>
        <button onclick="rebuildEmbeddings()">Rebuild embeddings</button>
        <a class="secondary" href="/">Quay lai camera</a>
      </div>
    </section>
    <section class="panel">
      <div class="list" id="group-list"></div>
    </section>
  </div>
  <script src="/static/review.js"></script>
</body>
</html>
